name: Build MULTI PAD LR PRO (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (x64)
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel 4

      - name: Package and verify Windows outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $art = Get-ChildItem -Path build -Directory -Filter '*_artefacts' | Select-Object -First 1
          if ($null -eq $art) {
            throw 'JUCE artefacts folder was not found under build/.'
          }

          $vst3Root = Join-Path $art.FullName 'Release\VST3'
          $standaloneRoot = Join-Path $art.FullName 'Release\Standalone'

          if (-not (Test-Path -LiteralPath $vst3Root -PathType Container)) {
            throw "VST3 output folder is missing: $vst3Root"
          }
          if (-not (Test-Path -LiteralPath $standaloneRoot -PathType Container)) {
            throw "Standalone output folder is missing: $standaloneRoot"
          }

          $vst3Bundle = Get-ChildItem -LiteralPath $vst3Root -Directory -Filter '*.vst3' | Select-Object -First 1
          $standaloneExe = Get-ChildItem -LiteralPath $standaloneRoot -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $vst3Bundle) {
            throw "No .vst3 bundle was produced in: $vst3Root"
          }
          if ($null -eq $standaloneExe) {
            throw "No Standalone .exe was produced in: $standaloneRoot"
          }

          Remove-Item -Recurse -Force stage, dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'stage\VST3', 'stage\Standalone', 'dist' | Out-Null

          Copy-Item -LiteralPath $vst3Bundle.FullName -Destination 'stage\VST3' -Recurse -Force
          Get-ChildItem -LiteralPath $standaloneRoot | Copy-Item -Destination 'stage\Standalone' -Recurse -Force

          Get-ChildItem -Path 'stage' -Recurse -File |
            Where-Object { $_.Extension -in @('.pdb', '.lib', '.exp') } |
            Remove-Item -Force

          $zipPath = 'dist\MULTI_PAD_LR_PRO_Windows.zip'
          Compress-Archive -Path 'stage\*' -DestinationPath $zipPath -Force
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw 'The Windows ZIP package was not created.'
          }

          Write-Host "VST3 bundle: $($vst3Bundle.FullName)"
          Write-Host "Standalone executable: $($standaloneExe.FullName)"
          Get-Item -LiteralPath $zipPath | Select-Object FullName, Length | Format-List

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MULTI_PAD_LR_PRO_Windows
          path: dist/MULTI_PAD_LR_PRO_Windows.zip
          if-no-files-found: error

  release:
    name: Publish Windows release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
